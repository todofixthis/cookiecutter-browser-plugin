# Bakes a real project from this template with cookiecutter and validates the
# result the same way a maintainer of a generated project would: lint,
# type-check, test, build both targets, e2e-test the Chromium build, and
# build its docs.
name: Generate and Validate

on:
  push: ~

permissions:
  contents: read

jobs:
  # Also runs Renovate's own validator on this repo's config and the baked
  # project's, each from the directory holding it (ADR 011).
  # With no renovate.json in its working directory the validator passes
  # having checked nothing, so each step checks the file exists first. Its
  # npm `deprecated` warnings come from Renovate's own dependencies. Keep
  # install scripts on: without re2's, Renovate falls back to JavaScript
  # regexes and accepts patterns the hosted app rejects.
  generate:
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.257.5

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"
      # Baked inside the workspace, not /tmp: the pnpm and Node setup steps
      # below resolve their version files relative to the workspace.
      - name: Bake a project with default answers
        run: uvx "cookiecutter>=2,<3" . --no-input --output-dir baked
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: baked/my-browser-plugin/package.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: baked/my-browser-plugin/.nvmrc
      - name: Validate this repo's Renovate config
        run: |
          test -f renovate.json
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
      - name: Validate the generated project's Renovate config
        run: |
          test -f renovate.json
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
        working-directory: baked/my-browser-plugin
      - name: Install the generated project's dependencies
        run: pnpm install --frozen-lockfile
        working-directory: baked/my-browser-plugin
      - name: Lint the generated project
        run: pnpm lint
        working-directory: baked/my-browser-plugin
      - name: Type-check the generated project
        run: pnpm typecheck
        working-directory: baked/my-browser-plugin
      - name: Test the generated project
        run: pnpm test
        working-directory: baked/my-browser-plugin
      - name: Build the generated project (both targets)
        run: pnpm build && pnpm build:firefox
        working-directory: baked/my-browser-plugin
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: baked/my-browser-plugin
      - name: e2e-test the generated project
        # Extensions require a headed browser (see test/e2e/fixtures.ts);
        # Xvfb provides the virtual display this runner has no real one for.
        run: xvfb-run --auto-servernum -- pnpm test:e2e
        working-directory: baked/my-browser-plugin
      - name: Build the generated project's docs
        run: pnpm typedoc
        working-directory: baked/my-browser-plugin
