# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: '{{ cookiecutter.node_version }}'

  jobs:
    post_install:
      - corepack enable
      - pnpm install --frozen-lockfile
    build:
      html:
        - pnpm exec typedoc --out $READTHEDOCS_OUTPUT/html
